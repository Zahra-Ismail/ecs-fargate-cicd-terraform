name: Terraform + Build + Deploy (ECS Fargate)

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.PROJECT }}
  ECR_REPO: ${{ vars.ECR_REPO }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: helps you confirm folder name (remove later if you want)
      - name: List repo files
        run: ls -la

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform
        run: |
          test -n "${TF_STATE_BUCKET}" || (echo "TF_STATE_BUCKET missing (GitHub Variable)" && exit 1)
          test -n "${TF_LOCK_TABLE}"  || (echo "TF_LOCK_TABLE missing (GitHub Variable)" && exit 1)

          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="key=ecs-fargate-demo/terraform.tfstate"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${AWS_REGION}" \
            -var="project=${PROJECT}" \
            -var="ecr_repo_name=${ECR_REPO}" \
            -var="tf_state_bucket=${TF_STATE_BUCKET}" \
            -var="tf_lock_table=${TF_LOCK_TABLE}"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image (latest + sha)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG} .
          docker tag ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPO}:latest
          docker push ${ECR_REGISTRY}/${ECR_REPO}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPO}:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${PROJECT} \
            --service ${PROJECT}-app \
            --force-new-deployment \
            --region ${AWS_REGION}

      - name: Wait for ECS stability
        run: |
          aws ecs wait services-stable \
            --cluster ${PROJECT} \
            --services ${PROJECT}-app \
            --region ${AWS_REGION}
