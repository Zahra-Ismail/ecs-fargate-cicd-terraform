name: Build & Deploy to ECS Fargate (Terraform)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: ecs-fargate-cicd-terraform

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::395512255485:role/Github_Action
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # ✅ NEW: Import ECS service into TF state if it already exists
      - name: Terraform Import ECS Service (if exists)
        working-directory: terraform
        run: |
          set +e
          CLUSTER_NAME="ecs-fargate-cicd-terraform-cluster"
          SERVICE_NAME="ecs-fargate-cicd-terraform"

          SVC_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --region "${{ env.AWS_REGION }}" \
            --query "services[0].serviceArn" \
            --output text 2>/dev/null)

          if [ "$SVC_ARN" != "None" ] && [ -n "$SVC_ARN" ]; then
            echo "Service exists: $SVC_ARN"
            echo "Importing into Terraform state..."
            terraform import aws_ecs_service.app "$CLUSTER_NAME/$SERVICE_NAME" || true
          else
            echo "Service does not exist. Terraform will create it."
          fi
          set -e

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="github_repo=Zahra-Ismail/ecs-fargate-cicd-terraform" \
            -var="container_image=${{ env.IMAGE_URI }}"
