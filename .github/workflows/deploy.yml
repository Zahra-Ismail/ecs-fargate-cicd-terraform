name: Build & Deploy to ECS Fargate

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: ecs-fargate-cicd-terraform
  ECR_REPOSITORY: ecs-fargate-cicd-terraform

  ECS_CLUSTER: ecs-fargate-cicd-terraform-cluster
  ECS_SERVICE: ecs-fargate-cicd-terraform

  # Public subnets + SG for public IP tasks
  PUBLIC_SUBNET_IDS: subnet-0164f734957437b65,subnet-06ea0eeeb4128fb22
  ECS_SG_ID: sg-0afdd074401ffe6ed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::395512255485:role/GitHub_ECS
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply (register new task definition revision)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="container_image=${{ env.IMAGE_URI }}"

      # Get the exact new task definition ARN from Terraform output
      - name: Read latest task definition ARN
        working-directory: terraform
        run: |
          echo "TASK_DEF_ARN=$(terraform output -raw task_definition_arn)" >> $GITHUB_ENV

      # Update networking + task definition in ONE call (most reliable)
      - name: Deploy to ECS (public subnets + public IP) and wait
        run: |
          echo "Deploying task definition: ${TASK_DEF_ARN}"

          aws ecs update-service \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${TASK_DEF_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=[${PUBLIC_SUBNET_IDS}],securityGroups=[${ECS_SG_ID}],assignPublicIp=ENABLED}" \
            --force-new-deployment

          # Print latest service events (helps debugging if wait fails)
          aws ecs describe-services \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].events[0:5].message" \
            --output text

          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}"
