name: Build & Deploy to ECS Fargate

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  PROJECT_NAME: ecs-fargate-cicd-terraform
  ECR_REPOSITORY: ecs-fargate-cicd-terraform

  ECS_CLUSTER: ecs-fargate-cicd-terraform-cluster
  ECS_SERVICE: ecs-fargate-cicd-terraform

  PUBLIC_SUBNET_1: subnet-0164f734957437b65
  PUBLIC_SUBNET_2: subnet-06ea0eeeb4128fb22
  ECS_SG: sg-0afdd074401ffe6ed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::395512255485:role/GitHub_ECS
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply (creates new task definition revision)
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="container_image=${{ env.IMAGE_URI }}" \
            -var="existing_vpc_id=vpc-01f7999b335c94e65" \
            -var='existing_private_subnet_ids=["subnet-01e277a197a998399","subnet-046d32a91c65f6d3c"]' \
            -var="existing_security_group_id=${{ env.ECS_SG }}" \
            -var="existing_ecr_repo_name=${{ env.ECR_REPOSITORY }}"

      - name: Read new task definition ARN from Terraform
        run: |
          echo "NEW_TD_ARN=$(cd terraform && terraform output -raw task_definition_arn)" >> $GITHUB_ENV
          echo "New task definition: $NEW_TD_ARN"

      # ✅ Single update: networking + public IP + new task definition
      - name: Deploy to ECS service (public IP + new task def)
        run: |
          aws ecs update-service \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --task-definition "${NEW_TD_ARN}" \
            --network-configuration "awsvpcConfiguration={subnets=[${PUBLIC_SUBNET_1},${PUBLIC_SUBNET_2}],securityGroups=[${ECS_SG}],assignPublicIp=ENABLED}" \
            --force-new-deployment

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --max-attempts 80 \
            --delay 15

      # ✅ If anything fails, show the real reason (events + task stop reasons)
      - name: Debug ECS (on failure)
        if: failure()
        run: |
          echo "---- Service events ----"
          aws ecs describe-services \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --services "${ECS_SERVICE}" \
            --query "services[0].events[0:15]" \
            --output table

          echo "---- Recent tasks ----"
          TASKS=$(aws ecs list-tasks \
            --region "${AWS_REGION}" \
            --cluster "${ECS_CLUSTER}" \
            --service-name "${ECS_SERVICE}" \
            --query "taskArns[0:5]" \
            --output text)

          echo "Tasks: $TASKS"

          if [ -n "$TASKS" ]; then
            echo "---- Task details ----"
            aws ecs describe-tasks \
              --region "${AWS_REGION}" \
              --cluster "${ECS_CLUSTER}" \
              --tasks $TASKS \
              --query "tasks[].{lastStatus:lastStatus,desiredStatus:desiredStatus,stoppedReason:stoppedReason,containers:containers[].{name:name,lastStatus:lastStatus,exitCode:exitCode,reason:reason}}" \
              --output json
          fi
